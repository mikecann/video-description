name: CI
on:
  push:
  pull_request:

jobs:
  bun:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit
      - run: bash -n install.sh video-description

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Host $_ }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Verify installer helpers and shared registry preservation
        shell: pwsh
        run: ./tests/install.Tests.ps1
